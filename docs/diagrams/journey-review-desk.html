<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One sitting at the review desk · User journey</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f3ee;
      --color-ink:     #20211f;
      --color-muted:   #686b63;
      --color-accent:  #176b55;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">User journey · Diagram Design</p>
    <h1>One sitting at the review desk</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="journey-review-desk-title journey-review-desk-desc">
      <title id="journey-review-desk-title">One sitting at the review desk</title>
      <desc id="journey-review-desk-desc">User journey of filing GitHub stars: paste a token in RAM, fetch, land in the unfiled inbox, file a sticky row, then export JSON or Markdown. Optional Lists stay off the happy path. The token never hits IndexedDB. Sentiment troughs at the inbox pile.</desc>

      <rect width="100%" height="100%" fill="#f6f3ee"/>

      <text x="164"  y="40" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 1</text>
      <text x="164"  y="60" fill="#20211f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Paste a PAT</text>
      <text x="388"  y="40" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 2</text>
      <text x="388"  y="60" fill="#20211f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fetch stars</text>
      <text x="612"  y="40" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 3</text>
      <text x="612"  y="60" fill="#20211f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Land in inbox</text>
      <text x="836"  y="40" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 4</text>
      <text x="836"  y="60" fill="#20211f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">File a row</text>
      <text x="1060" y="40" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 5</text>
      <text x="1060" y="60" fill="#20211f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Export a copy</text>

      <line x1="64" y1="88" x2="1160" y2="88" stroke="rgba(32,33,31,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="168" x2="1160" y2="168" stroke="rgba(32,33,31,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="248" x2="1160" y2="248" stroke="rgba(32,33,31,0.10)" stroke-width="0.8"/>
      <text x="56" y="92" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">HIGH</text>
      <text x="56" y="172" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">NEUTRAL</text>
      <text x="56" y="252" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">LOW</text>

      <polyline points="164,168 388,128" fill="none" stroke="#686b63" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="388,128 612,248" fill="none" stroke="#176b55" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="612,248 836,88 1060,128" fill="none" stroke="#686b63" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="164"  cy="168" r="5" fill="#686b63"/>
      <circle cx="388"  cy="128" r="5" fill="#686b63"/>
      <circle cx="612"  cy="248" r="5" fill="#176b55"/>
      <circle cx="836"  cy="88"  r="5" fill="#686b63"/>
      <circle cx="1060" cy="128" r="5" fill="#686b63"/>

      <line x1="64" y1="280" x2="1160" y2="280" stroke="rgba(32,33,31,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="392" x2="1160" y2="392" stroke="rgba(32,33,31,0.10)" stroke-width="0.8"/>
      <text x="56" y="336" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">ACTIONS</text>
      <text x="56" y="432" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">TOUCHPOINTS</text>

      <text x="164"  y="304" fill="#20211f" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Paste token into RAM</text>
      <text x="388"  y="304" fill="#20211f" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Wait while pages load</text>
      <text x="612"  y="304" fill="#20211f" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Face the unfiled queue</text>
      <text x="836"  y="304" fill="#20211f" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">File; it stays put</text>
      <text x="1060" y="304" fill="#20211f" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Download JSON or Markdown</text>

      <rect x="520" y="320" width="184" height="16" rx="2" fill="rgba(23,107,85,0.08)" stroke="rgba(23,107,85,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="612" y="332" fill="#176b55" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">UNFILED QUEUE</text>
      <rect x="520" y="340" width="184" height="16" rx="2" fill="rgba(23,107,85,0.08)" stroke="rgba(23,107,85,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="612" y="352" fill="#176b55" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">NO J/K YET · P0-4</text>

      <text x="164"  y="428" fill="#686b63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">password · never IDB</text>
      <text x="388"  y="428" fill="#686b63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">progress + live status</text>
      <text x="612"  y="428" fill="#686b63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">#inbox list</text>
      <text x="836"  y="428" fill="#686b63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sticky · cellar cache</text>
      <text x="1060" y="428" fill="#686b63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">download · optional Lists</text>

      <line x1="64" y1="640" x2="1216" y2="640" stroke="rgba(32,33,31,0.10)" stroke-width="0.8"/>
      <text x="64" y="664" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <line x1="64" y1="688" x2="80" y2="688" stroke="#686b63" stroke-width="1.5"/>
      <circle cx="72" cy="688" r="3" fill="#686b63"/>
      <text x="88" y="692" fill="#686b63" font-size="8.5" font-family="'Geist', sans-serif">Sentiment curve</text>
      <line x1="256" y1="688" x2="272" y2="688" stroke="#176b55" stroke-width="1.5"/>
      <circle cx="264" cy="688" r="3" fill="#176b55"/>
      <text x="280" y="692" fill="#686b63" font-size="8.5" font-family="'Geist', sans-serif">Trough stage</text>
      <rect x="432" y="684" width="16" height="8" rx="2" fill="rgba(23,107,85,0.08)" stroke="rgba(23,107,85,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="456" y="692" fill="#686b63" font-size="8.5" font-family="'Geist', sans-serif">Pain marker</text>
    </svg>
  </div>
</body>
</html>
