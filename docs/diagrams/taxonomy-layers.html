<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cellar taxonomy · Four layers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f3ee;
      --color-ink:     #20211f;
      --color-muted:   #686b63;
      --color-accent:  #176b55;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Diagram Design</p>
    <h1>Cellar taxonomy · Do not collapse the layers</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="taxonomy-layers-title taxonomy-layers-desc">
      <title id="taxonomy-layers-title">Cellar taxonomy · Do not collapse the layers</title>
      <desc id="taxonomy-layers-desc">Layer stack from visible row signals down through facets and optional granular children to primary shelves, then sticky identity. Primary shelves are the focal filing home.</desc>

      <rect width="100%" height="100%" fill="#f6f3ee"/>

      <text x="48" y="72" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SCAN</text>
      <line x1="64" y1="88" x2="64" y2="520" stroke="rgba(32,33,31,0.30)" stroke-width="1"/>
      <polygon points="60,88 68,88 64,80" fill="#686b63"/>
      <polygon points="60,520 68,520 64,528" fill="#686b63"/>
      <text x="48" y="548" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FILE</text>

      <line x1="160" y1="80" x2="1200" y2="80" stroke="rgba(32,33,31,0.12)" stroke-width="1"/>
      <line x1="160" y1="440" x2="1200" y2="440" stroke="rgba(32,33,31,0.12)" stroke-width="1"/>

      <rect x="160" y="80" width="1040" height="72" fill="#ffffff"/>
      <line x1="160" y1="152" x2="1200" y2="152" stroke="rgba(32,33,31,0.12)" stroke-width="1"/>
      <text x="180" y="120" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
      <text x="280" y="122" fill="#20211f" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Signals</text>
      <text x="1180" y="122" fill="#686b63" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">stars · pushed_at · P1-6</text>

      <rect x="160" y="152" width="1040" height="72" fill="rgba(32,33,31,0.02)"/>
      <line x1="160" y1="224" x2="1200" y2="224" stroke="rgba(32,33,31,0.12)" stroke-width="1"/>
      <text x="180" y="192" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
      <text x="280" y="194" fill="#20211f" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Facets</text>
      <text x="1180" y="194" fill="#686b63" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">language · archived · license · P1-3</text>

      <rect x="160" y="224" width="1040" height="72" fill="#ffffff"/>
      <line x1="160" y1="296" x2="1200" y2="296" stroke="rgba(32,33,31,0.12)" stroke-width="1"/>
      <text x="180" y="264" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="280" y="266" fill="#20211f" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Granular children</text>
      <text x="1180" y="266" fill="#686b63" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">optional · default off · P1-7</text>

      <rect x="160" y="296" width="1040" height="72" fill="rgba(23,107,85,0.08)"/>
      <rect x="160" y="296" width="1040" height="72" fill="none" stroke="#176b55" stroke-width="1"/>
      <text x="180" y="336" fill="#176b55" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
      <text x="280" y="338" fill="#20211f" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Primary shelves</text>
      <text x="1180" y="338" fill="#176b55" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">one filing home · ~14 + Self-Hosted</text>

      <rect x="160" y="368" width="1040" height="72" fill="rgba(32,33,31,0.02)"/>
      <text x="180" y="408" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L0</text>
      <text x="280" y="410" fill="#20211f" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Sticky identity</text>
      <text x="1180" y="410" fill="#686b63" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">stable id · cellar JSON · never the token</text>

      <text x="160" y="488" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL LAYER</text>
      <text x="280" y="488" fill="#686b63" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">File into a shelf. Filter and sort above it. Do not turn language or last-push into another category.</text>

      <line x1="160" y1="640" x2="1200" y2="640" stroke="rgba(32,33,31,0.10)" stroke-width="0.8"/>
      <text x="160" y="664" fill="#686b63" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="160" y="680" width="16" height="8" fill="rgba(23,107,85,0.08)" stroke="#176b55" stroke-width="1"/>
      <text x="184" y="688" fill="#686b63" font-size="8.5" font-family="'Geist', sans-serif">Filing home</text>
      <rect x="360" y="680" width="16" height="8" fill="#ffffff" stroke="rgba(32,33,31,0.12)" stroke-width="1"/>
      <text x="384" y="688" fill="#686b63" font-size="8.5" font-family="'Geist', sans-serif">Filter or sort</text>
      <rect x="560" y="680" width="16" height="8" fill="rgba(32,33,31,0.02)" stroke="rgba(32,33,31,0.12)" stroke-width="1"/>
      <text x="584" y="688" fill="#686b63" font-size="8.5" font-family="'Geist', sans-serif">Identity / optional grain</text>
    </svg>
  </div>
</body>
</html>
